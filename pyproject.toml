[project]
name = "house-ml"
version = "0.1.0"
description = "Full pipeline for training and deploying a machine learning model to predict house prices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "category-encoders>=2.9.0",
    "evidently>=0.7.21",
    "fastapi>=0.136.3",
    "great-expectations>=1.17.2",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.12.0",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "polars>=1.41.0",
    "pytest>=9.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
