[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-ml"
version = "0.1.0"
description = "Full pipeline for training and deploying a machine learning model to predict house prices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "category-encoders>=2.9.0",
    "fastapi>=0.136.3",
    "joblib>=1.4.0",
    "matplotlib>=3.10.0",
    "mlflow>=3.12.0",
    "numpy>=2.2.0",
    "optuna>=4.8.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "pytest>=9.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.57.0",
    "uvicorn[standard]>=0.35.0",
    "xgboost>=3.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
